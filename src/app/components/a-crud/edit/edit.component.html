<form #myForm="ngForm" (submit)="putData(myForm.value)">
  <label>Enter Employee Name : </label>
  <input
    type="text"
    name="ename"
    class="form-control"
    [ngModel]="empData?.name"
    required
  />

  <label>Enter Employee Post : </label>
  <input
    type="text"
    name="epost"
    class="form-control"
    [ngModel]="empData?.post"
    required
  />

  <label>Enter Employee Salary : </label>
  <input
    type="text"
    name="esalary"
    class="form-control"
    [ngModel]="empData?.salary"
    required
  />

  <label>Enter Employee City : </label>
  <input
    type="text"
    name="ecity"
    class="form-control"
    [ngModel]="empData?.address"
    required
  />

  <button type="button" class="btn-clear mt-1 mr-1" (click)="back()">
    Go to back
  </button>
  <button
    type="submit"
    class="btn btn-warning mt-1"
    [disabled]="myForm.invalid"
  >
    Update Details
  </button>
</form>
