<div class="row mt-3 mb-2">
  <p class="mb-2 bold">Total number of Employees: {{ count }}</p>
  <div class="col-sm-8 mt-2">
    <button
      type="button"
      class="btn btn-primary mb-2"
      routerLink="/crud/add"
      container="body"
      [routerLinkActive]="['active']"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="fas fa-plus-square" aria-hidden="true"></i>
      Add new employee
    </button>
  </div>
  <!--This is add button, Clicking on it will lead to add component, where the logic is written-->
  <!-- TODO: Search with [(ngModel)]="term"-->
  <div class="col-sm-4">
    <input
      type="text"
      name="search"
      id=""
      class="form-control"
      placeholder="Searching Someone..?"
    />
  </div>
  <!--This is a search box. We can search anyone-->
</div>
<table class="table table-light">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Post</th>
      <th>Salary</th>
      <th>Address</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <!-- | filter : term -->
    <tr
      *ngFor="
        let e of empList
          | paginate : { itemsPerPage: countPerPage, currentPage: p }
      "
    >
      <!--Doing multiple things here, for loop to obtain all data, doing pagination and using filter for search bar-->
      <td>{{ e.id }}</td>
      <td>{{ e.name }}</td>
      <td>{{ e.post }}</td>
      <td>{{ e.salary }}</td>
      <td>{{ e.address }}</td>
      <td>
        <button
          type="button"
          class="btn btn-outline-info"
          [routerLink]="['edit', e.id]"
        >
          <i class="fa fa-pencil" aria-hidden="true"></i>
        </button>
        <!--Tis will take us to edit component, where edit logic is written -->
        💠
        <button
          type="button"
          class="btn btn-outline-danger"
          (click)="delete(e.id)"
        >
          <i class="fas fa-trash-can" aria-hidden="true"></i>
        </button>
        <!--Calling delete function to remove the record-->
      </td>
    </tr>
  </tbody>
</table>
<div class="text-right">
  <pagination-controls (pageChange)="p = $event"></pagination-controls>
  <!--for pagination-->
</div>
