<form #myForm="ngForm" (submit)="addData(myForm.value)">
  <label>Enter Employee Name : </label>
  <input type="text" name="ename" class="form-control" ngModel required />

  <label>Enter Employee Post : </label>
  <input type="text" name="epost" class="form-control" ngModel required />

  <label>Enter Employee Salary : </label>
  <input type="text" name="esalary" class="form-control" ngModel required />

  <label>Enter Employee City : </label>
  <input type="text" name="ecity" class="form-control" ngModel required />

  <button type="button" class="btn-clear mt-1 mr-1" (click)="back()">
    Go to back
  </button>
  <button
    type="button"
    class="btn-clear mt-1 mr-1"
    (click)="myForm.resetForm()"
  >
    Reset Form
  </button>
  <button
    type="submit"
    class="btn btn-success mt-1"
    [disabled]="myForm.invalid"
  >
    Save Details
  </button>
</form>
