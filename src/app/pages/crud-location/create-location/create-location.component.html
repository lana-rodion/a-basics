<div class="main">
  <div class="container">
    <h2>Create User Form</h2>
    <form [formGroup]="createFormGroup" action="" method="">
      <label for="name">Location Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        formControlName="name"
        required
      />
      <label for="city">City:</label>
      <input
        type="text"
        id="city"
        name="city"
        formControlName="city"
        required
      />
      <label for="state">State:</label>
      <input
        type="text"
        id="state"
        name="state"
        formControlName="state"
        required
      />
      <label for="photo">Photo:</label>
      <input id="photo" name="photo" type="file" formControlName="photo" />
      <label for="availableUnits">Available Units:</label>
      <input
        type="number"
        id="availableUnits"
        name="availableUnits"
        formControlName="availableUnits"
        min="1"
        required
      />
      <label for="wifi">Wi-Fi:</label>
      <input id="wifi" name="wifi" type="text" formControlName="wifi" />
      <label for="laundry">Laundry:</label>
      <input
        type="text"
        id="laundry"
        name="laundry"
        formControlName="laundry"
      />
      <button class="btn-clear mr-1" type="button" (click)="back()">
        Return back
      </button>
      <button class="mr-2" type="submit" (click)="createLocation()">
        Create
      </button>
      <span class="ml-1" [class]="isValid">{{ msg }}</span>
    </form>
  </div>
</div>
